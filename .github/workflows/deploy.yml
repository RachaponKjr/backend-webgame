name: Deploy NestJS via SSH

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Save Docker Image
        run: |
          docker build -t nestjs-backend:latest .
          docker save nestjs-backend:latest > nestjs-backend.tar

      - name: Copy Image to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: 'nestjs-backend.tar'
          target: '/home/${{ secrets.SERVER_USER }}/deploy'

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # 1. เข้าไปที่โฟลเดอร์เก็บไฟล์
            cd /home/${{ secrets.SERVER_USER }}/deploy

            # สร้างไฟล์ .env จาก GitHub Secret
            echo "${{ secrets.ENV_FILE }}" > /root/.env

            # 2. Load Image เข้า Docker
            docker load < nestjs-backend.tar

            # 3. ลบ Container เก่า (ถ้ามี) และรันตัวใหม่
            docker stop nestjs-api || true
            docker rm nestjs-api || true

            mkdir -p /home/user/data
            mkdir -p /home/user/uploads
            chmod -R 777 /home/user/data /home/user/uploads

            # รันคอนเทนเนอร์ โดยแก้จุด Volume ไม่ให้ไปทับโฟลเดอร์ prisma
            docker run -d \
              --name nestjs-api \
              --env-file /root/.env \
              -p 3000:3000 \
              -v /home/user/data:/app/data \
              --restart always \
              nestjs-backend:latest

            # สั่ง Prisma Sync อัตโนมัติทันทีหลัง Start (ใช้ DATABASE_URL จาก .env ในคอนเทนเนอร์)
            # ใส่ sleep เพื่อรอให้แอปเริ่มระบบสักครู่
            sleep 5
            docker exec nestjs-api npx prisma db push --accept-data-loss

            rm nestjs-backend.tar
